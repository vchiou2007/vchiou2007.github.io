<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>月亮代表我的心 · 智慧吉他譜</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
<header><div class="heading"><div><h1 id="title">月亮代表我的心</h1><p><span id="artist">鄧麗君</span><span class="dot">·</span>靜態智慧吉他譜</p></div><div class="actions"><button id="favorite" aria-label="收藏歌曲" title="收藏歌曲">♡</button><button id="settings" aria-label="閱讀設定" title="閱讀設定">☷</button><button id="more" aria-label="歌曲工具" title="歌曲工具">⋯</button></div></div>
<div class="metadata"><span>C 調</span><span id="capo">Capo 待確認</span><span>4/4</span><span id="bpm">BPM 待確認</span><button id="source">原譜 ↗</button></div></header>
<div class="transport" aria-label="自動捲譜控制"><div class="transport-main"><select id="readingMode" aria-label="閱讀模式"><option value="continuous">連續捲譜</option><option value="pages">手動分頁</option></select><label class="tempo-label">BPM <input id="scrollBpm" type="number" min="20" max="300" step="1" value="74" aria-label="捲動速度 BPM"></label><button id="playScroll">▶ 開始</button><button id="restartScroll" aria-label="回到開頭">↶ 開頭</button><button id="timingSettings" aria-label="速度與拍數設定">拍數設定</button></div><div id="scrollProgress"><input id="beatSeek" type="range" min="0" max="144" step="0.01" value="0" aria-label="演奏進度"><span id="scrollClock" aria-live="off">準備演奏</span></div></div>
<section id="score" aria-label="彩色和弦譜"></section>
<div class="status"><span id="sectionStatus"></span><span id="saveStatus">換和弦提示 · 非逐拍節奏譜</span></div>
<footer><div id="legend" aria-label="固定按鍵與和弦對照"></div><nav><button id="prev">〈 上一頁</button><button id="page" title="前往指定頁面" aria-label="選擇頁面"></button><button id="next">下一頁 〉</button></nav></footer>
</main><dialog id="dialog"><div class="dialog-top"><h2 id="dialogTitle"></h2><button id="close" aria-label="關閉">×</button></div><div id="dialogBody"></div></dialog><div id="toast" role="status"></div><input type="file" id="file" accept="application/json,.json" hidden><script src="core.js"></script><script src="app.js"></script><script src="scroll.js"></script><script src="ipad.js"></script></body></html>
